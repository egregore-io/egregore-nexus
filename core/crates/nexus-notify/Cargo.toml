[package]
name = "egregore-nexus-notify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish = ["crates-io"]
description = "Nexus notifications (backend spec §7): internal notification ingest, HMAC-SHA256 re-verify of the gateway-forwarded signature, the Pub monitor feed, and route-by-source/topic dispatch. Internal ingest only — the daemon hosts no /notify HTTP route. Implements NotifyPort."

[lib]
name = "nexus_notify"
path = "src/lib.rs"

[dependencies]
nexus-contracts = { workspace = true }
nexus-common = { workspace = true }
nexus-store = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
