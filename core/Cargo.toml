[workspace]
resolver = "2"
members = ["crates/nexus-contracts", "crates/nexus-common", "crates/nexus-store", "crates/nexus-dispatch", "crates/nexus-identity", "crates/nexus-bus", "crates/nexus-acp-stream", "crates/nexus-agent", "crates/nexus-search", "crates/nexus-notify", "crates/nexus-admin", "crates/nexus-pty", "crates/nexus-transcript", "crates/nexus", "crates/harness/core", "crates/harness/claude", "crates/harness/codex", "tests"]

[workspace.package]
version = "0.1.6-beta.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/egregore-io/egregore-nexus"
homepage = "https://github.com/egregore-io/egregore-nexus"
readme = "../README.md"

[workspace.metadata.nexus.distribution]
components = ["nexus-cli-daemon", "nexus-gateway", "nexus-webui"]
binary-crate = "egregore-nexus"
binary-name = "nexus"
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
hardened-targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
experimental-targets = [
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
wsl-target = "x86_64-unknown-linux-gnu"

[profile.release]
# Strip symbols in every native build. Linux packaging additionally removes the ELF `.comment`
# section before npm assembly; Mach-O and PE/COFF do not carry that ELF section.
strip = "symbols"

[patch.crates-io]
libsql = { path = "vendor/libsql" }
portable-pty = { path = "vendor/portable-pty" }

[workspace.dependencies]
nexus-contracts = { path = "crates/nexus-contracts", version = "=0.1.6-beta.2" }
nexus-common = { package = "egregore-nexus-common", path = "crates/nexus-common", version = "=0.1.6-beta.2" }
nexus-store = { path = "crates/nexus-store", version = "=0.1.6-beta.2" }
nexus-dispatch = { path = "crates/nexus-dispatch", version = "=0.1.6-beta.2" }
nexus-identity = { path = "crates/nexus-identity", version = "=0.1.6-beta.2" }
nexus-bus = { path = "crates/nexus-bus", version = "=0.1.6-beta.2" }
nexus-acp-stream = { path = "crates/nexus-acp-stream", version = "=0.1.6-beta.2" }
nexus-agent = { path = "crates/nexus-agent", version = "=0.1.6-beta.2" }
nexus-search = { path = "crates/nexus-search", version = "=0.1.6-beta.2" }
nexus-notify = { package = "egregore-nexus-notify", path = "crates/nexus-notify", version = "=0.1.6-beta.2" }
nexus-admin = { path = "crates/nexus-admin", version = "=0.1.6-beta.2" }
nexus-pty = { path = "crates/nexus-pty", version = "=0.1.6-beta.2" }
nexus-transcript = { path = "crates/nexus-transcript", version = "=0.1.6-beta.2" }
nexus-harness-core = { path = "crates/harness/core", version = "=0.1.6-beta.2" }
nexus-harness-claude = { path = "crates/harness/claude", version = "=0.1.6-beta.2" }
nexus-harness-codex = { path = "crates/harness/codex", version = "=0.1.6-beta.2" }

agent-client-protocol = { version = "0.15", features = ["unstable_end_turn_token_usage"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
time = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
figment = { version = "0.10", features = ["toml", "env"] }
tokio = { version = "1", features = ["full"] }
libsql = { version = "0.6", default-features = false, features = ["core"] }
libsql-sys = { version = "=0.8.0", default-features = false }
hmac = "0.12"
sha2 = "0.10"
axum = "0.7"
tower = "0.5"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
clap = { version = "4", features = ["derive"] }
bincode = "1"
tokio-tungstenite = "0.24"
